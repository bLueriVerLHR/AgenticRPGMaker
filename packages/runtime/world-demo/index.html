<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>AgenticRPGMaker — The Crossroads (world demo)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0e14;
        color: #ddd;
        font:
          14px/1.5 system-ui,
          sans-serif;
        height: 100%;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-canvas {
        image-rendering: pixelated;
        background: #22332a;
        max-width: 100vw;
        max-height: 100vh;
      }
      #root {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" width="640" height="480"></canvas>
    </div>
    <div id="root"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
